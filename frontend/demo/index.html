<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sallcll — 빈 시간에 맞는 강의</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-bar" aria-hidden="true"></div>
    <div class="topbar-inner">
      <a class="logo" href="./index.html">
        <span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        Sallcll
      </a>
      <span class="semester">2026-2 · 서경대</span>
      <button class="btn btn-ghost" type="button">로그인</button>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" aria-labelledby="wish-title">
      <div class="panel-head">
        <h1 id="wish-title">위시 시간표</h1>
        <p class="hint">빈 칸을 누르면 그 교시 과목이 오른쪽에 나옵니다.</p>
      </div>
      <div class="grid-wrap">
        <table class="tt">
          <thead>
            <tr>
              <th class="time" scope="col"><span class="visually-hidden">교시</span></th>
              <th scope="col">월</th>
              <th scope="col">화</th>
              <th scope="col">수</th>
              <th scope="col">목</th>
              <th scope="col">금</th>
            </tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel results" aria-labelledby="course-title">
      <div class="panel-head">
        <h2 id="course-title">과목</h2>
        <span class="credits" id="credits">0학점</span>
      </div>
      <form class="search" id="search-form" role="search">
        <input id="q" type="search" name="q" placeholder="과목·교수 검색" autocomplete="off" />
        <button class="btn btn-primary" type="submit">검색</button>
      </form>
      <p class="empty" id="empty">빈 칸을 누르면 그 시간에 열리는 과목이 나옵니다.</p>
      <ul class="result-list" id="results"></ul>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
