<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sallcll 메인 목업</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./mock.css" />
</head>
<body>
  <main class="gallery">
    <p class="kicker">디자인 목업 · 시안은 한 장씩</p>
    <h1>메인 방향을 고르세요</h1>
    <p>메인 시안 5장: <a href="./themes/index.html">목록</a>. 토스는 그대로, 나머진 뼈대가 다릅니다.</p>

    <div class="cards">
      <a class="pick" href="./themes/index.html">
        <div class="prev">풀페이지 5장</div>
        <div class="meta">
          <h2>메인 시안 목록</h2>
          <p>10장. 토스부터 카카오톡까지, 뼈대가 다름.</p>
        </div>
      </a>
      <a class="pick" href="./a-home.html">
        <div class="prev">홈 · 요약 카드 + 큰 시간표</div>
        <div class="meta">
          <h2>A. 올클형 홈</h2>
          <p>올클 메인처럼 시간표가 홈의 주인공. 학점·과목 숫자만 위에 둠.</p>
        </div>
      </a>
      <a class="pick" href="./b-workbench.html">
        <div class="prev">시간표 3 : 검색 2</div>
        <div class="meta">
          <h2>B. 올클형 작업대</h2>
          <p>올클 시간표 페이지와 같은 분할. 짜는 화면이 곧 메인.</p>
        </div>
      </a>
      <a class="pick" href="./c-wish.html">
        <div class="prev">초록 위시 칸 + 추천 리스트</div>
        <div class="meta">
          <h2>C. 위시 페인트</h2>
          <p>우리 차별점. 빈 시간을 칠하면 오른쪽에 과목이 뜸.</p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
